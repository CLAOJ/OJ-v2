# claoj_v2_nginx — source of truth: OJ-v2 scripts/v2-nginx/v2.conf, deployed to
# /root/claoj-v2/nginx-conf.d/v2.conf on the claoj host. See docs/deployment.md
# §10.1 before adding pages to $v2_public_page.

# Docker embedded DNS so nginx re-resolves upstreams after a container recreate
# (e.g. a Watchtower auto-deploy). The upstreams below use `resolve`, which keeps
# that behaviour while allowing keepalive connections (nginx >= 1.27.3).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream v2_web {
    zone v2_web 64k;
    server claoj_v2_web:3000 resolve;
    keepalive 32;
}

upstream v2_backend {
    zone v2_backend 64k;
    server claoj_v2_backend:8081 resolve;
    keepalive 32;
}

# 15s microcache for page HTML. Logged-out views of any page share it; logged-in
# views share it only on the public list pages below, whose server render is
# anonymous (per-user bits load client-side after hydration, and every list
# refetches fresh on mount, so new problems/contests/ratings show at once).
# The only per-user server output on those pages is the navbar's logged-in
# hint, so $v2_logged_in is part of the key. Next.js only ever sets NEXT_LOCALE on page
# responses, and the locale inputs are part of the key, so replaying it is safe.
proxy_cache_path /var/cache/nginx/v2 levels=1:2 keys_zone=v2_pages:10m max_size=200m inactive=10m use_temp_path=off;

map "$cookie_access_token$cookie_refresh_token" $v2_logged_in {
    ""      0;
    default 1;
}

# Keep this list to pages whose server render reads no per-user data.
map $uri $v2_public_page {
    ~^/((problems|contests|ratings|users|organizations)|(problem|contest|user|post)/[^/]+)?/?$  1;
    default 0;
}

map "$v2_logged_in$v2_public_page" $v2_skip_cache {
    "10"    1;
    default 0;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 256m;
    charset utf-8;

    # v1 uploads (problem/blog images, org logos) now live on R2 behind the CDN.
    location /martor/ {
        return 301 https://cdn.claoj.edu.vn$request_uri;
    }

    location /api/events {
        proxy_pass http://v2_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400;
    }
    location /api/ {
        proxy_pass http://v2_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://v2_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache v2_pages;
        proxy_cache_key "$scheme$host$request_uri|$cookie_next_locale|$http_accept_language|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree|$http_next_url|$v2_logged_in";
        proxy_cache_valid 200 15s;
        proxy_cache_bypass $v2_skip_cache;
        proxy_no_cache $v2_skip_cache;
        # Next.js marks dynamic pages no-store; we cache the views above anyway.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
