name: ci-cd

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: read # changes: find the last successful run

env:
  IMAGE_BACKEND: ghcr.io/claoj/claoj-go
  IMAGE_WEB: ghcr.io/claoj/claoj-web

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      judge: ${{ steps.filter.outputs.judge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Diff against the last successful main run, not just this push: a run
      # cancelled by a newer push (cancel-in-progress) would otherwise leave
      # its changes unbuilt when the newer push touches other paths.
      - name: Last successful main build
        id: base
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list -R "${{ github.repository }}" --workflow ci-cd.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            backend:
              - 'claoj/**'
              - '.github/workflows/ci-cd.yml'
            web:
              - 'claoj-web/**'
              - '.github/workflows/ci-cd.yml'
            judge:
              - 'claoj-judge/**'
              - '.github/workflows/ci-cd.yml'

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claoj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: claoj/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test (exclude DB-backed integration)
        run: go list ./... | grep -v '/integration' | xargs go test

  test-judge:
    needs: changes
    if: needs.changes.outputs.judge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claoj-judge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: claoj-judge/go.sum
      - run: go vet ./...
      - run: go test ./...

  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claoj-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: claoj-web/package-lock.json
      - run: npm ci
      - run: npm test -- --ci

  # ESLint is advisory: it runs and surfaces every finding as annotations but
  # never blocks the pipeline (the web app carries pre-existing lint debt).
  # Tests + build remain the hard gate for publishing.
  lint-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: claoj-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: claoj-web/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Images build on main in parallel with the tests and are pushed with only
  # their sha tag; promote-* moves :latest (what the server deploys) once the
  # tests have passed. dev/PRs run tests only.
  build-push-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Go caches
        id: gocache
        uses: actions/cache@v4
        with:
          path: |
            go-mod
            go-build
          key: docker-go-${{ hashFiles('claoj/go.sum') }}-${{ github.sha }}
          restore-keys: docker-go-${{ hashFiles('claoj/go.sum') }}-
      - name: Go caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {"go-mod": "/go/pkg/mod", "go-build": "/root/.cache/go-build"}
          skip-extraction: ${{ steps.gocache.outputs.cache-hit }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: claoj
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-push-web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: npm and Next caches
        id: webcache
        uses: actions/cache@v4
        with:
          path: |
            npm-cache
            next-cache
          key: docker-web-${{ hashFiles('claoj-web/package-lock.json') }}-${{ github.sha }}
          restore-keys: docker-web-${{ hashFiles('claoj-web/package-lock.json') }}-
      - name: npm and Next caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {"npm-cache": "/root/.npm", "next-cache": "/app/.next/cache"}
          skip-extraction: ${{ steps.webcache.outputs.cache-hit }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=sha,prefix=sha-,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: claoj-web
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  promote-backend:
    needs: [test-backend, build-push-backend]
    if: ${{ success() && needs.build-push-backend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested image as latest
        run: docker buildx imagetools create -t ${{ env.IMAGE_BACKEND }}:latest ${{ env.IMAGE_BACKEND }}:sha-${GITHUB_SHA::7}

  promote-web:
    needs: [test-web, build-push-web]
    if: ${{ success() && needs.build-push-web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested image as latest
        run: docker buildx imagetools create -t ${{ env.IMAGE_WEB }}:latest ${{ env.IMAGE_WEB }}:sha-${GITHUB_SHA::7}
